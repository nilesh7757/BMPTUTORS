    });

      renderSlide(parseInt(e.target.value));
    });

    // Keyboard bindings
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        if (currentIndex < SLIDES.length - 1) renderSlide(currentIndex + 1);
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        if (currentIndex > 0) renderSlide(currentIndex - 1);
      } else if (e.key === 'Home') {
        renderSlide(0);
      } else if (e.key === 'End') {
        renderSlide(SLIDES.length - 1);
      } else if (e.key === 'n' || e.key === 'N') {
        toggleNotes();
      } else if (e.key === 'o' || e.key === 'O') {
        toggleOverview();
      } else if (e.key === 'Escape') {
        closeOverview();
        closeNotes();
      }
    });

    // Notes Drawer
    let notesOpen = false;
    function toggleNotes() {
      notesOpen = !notesOpen;
      notesDrawer.style.transform = notesOpen ? 'translateX(0)' : 'translateX(100%)';

      notesOpen = false;

    }
    notesToggleBtn.addEventListener('click', toggleNotes);
    notesCloseBtn.addEventListener('click', closeNotes);

    // Overview Grid
    let overviewOpen = false;
    function populateOverview() {
      overviewGrid.innerHTML = '';
      SLIDES.forEach((s, idx) => {
        const card = document.createElement('div');
        card.className = 'p-3 rounded-xl bg-slate-900 border border-slate-800 hover:border-sky-500 cursor-pointer transition flex flex-col justify-between h-36';
        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between text-[10px] font-mono text-slate-400 mb-1">
              <span>#${String(idx + 1).padStart(2, '0')}</span>
              <span class="px-1.5 py-0.5 rounded bg-slate-800 text-sky-400">${s.badge}</span>
            </div>
            <div class="text-xs font-bold text-white line-clamp-2">${s.title}</div>
          </div>
          <div class="text-[10px] text-slate-400 font-mono">${s.target_time}</div>
        `;
        card.addEventListener('click', () => {
          renderSlide(idx);
          closeOverview();
        });
        overviewGrid.appendChild(card);
      });
    }

    function toggleOverview() {
      overviewOpen = !overviewOpen;
      if (overviewOpen) {
        populateOverview();
        overviewModal.classList.remove('hidden');
        setTimeout(() => overviewModal.classList.remove('opacity-0'), 10);
      } else {
        closeOverview();
      }
    }
    function closeOverview() {
      overviewOpen = false;
      overviewModal.classList.add('opacity-0');
      setTimeout(() => overviewModal.classList.add('hidden'), 250);
    }
    overviewBtn.addEventListener('click', toggleOverview);
    overviewCloseBtn.addEventListener('click', closeOverview);

    // Fullscreen
    fsBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    });

    // Initial render
    renderSlide(0);
  </script>
</body>
</html>
